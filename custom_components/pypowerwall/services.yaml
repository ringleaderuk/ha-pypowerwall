schedule_max_backup:
  fields:
    duration_seconds:
      example: 7200
      default: 7200
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: seconds
          mode: box

cancel_max_backup: {}

set_export_window:
  fields:
    start:
      example: "2026-11-28 13:00:00"
      selector:
        datetime:
    end:
      required: true
      example: "2026-11-28 14:00:00"
      selector:
        datetime:
    price:
      example: 2.0
      default: 2.0
      selector:
        number:
          min: 0.01
          max: 100
          step: 0.01
          mode: box

clear_export_windows: {}

update_tariff: {}
